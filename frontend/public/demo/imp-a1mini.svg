    <feFlood flood-color="#f2efe8"/><feComposite in2="round" operator="in" result="border"/>
    <feOffset in="round" dx="11" dy="13" result="o"/>
    <feFlood flood-color="#0d0e0f"/><feComposite in2="o" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
