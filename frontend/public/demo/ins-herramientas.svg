<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Herramientas">
  <defs>
  <filter id="sticker" x="-12%" y="-12%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="11" result="d"/>
    <feGaussianBlur in="d" stdDeviation="4" result="b"/>
    <feComponentTransfer in="b" result="round"><feFuncA type="linear" slope="24" intercept="-11"/></feComponentTransfer>
    <feFlood flood-color="#f2efe8"/><feComposite in2="round" operator="in" result="border"/>
    <feOffset in="round" dx="11" dy="13" result="o"/>
    <feFlood flood-color="#0d0e0f"/><feComposite in2="o" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
  <g filter="url(#sticker)"><g transform="translate(300 300) rotate(0) scale(1)">
  <g transform="rotate(-38)">
    <rect x="-30" y="-40" width="60" height="190" rx="14" fill="#ffd21f" stroke="#0d0e0f" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-26 -40 V-160 L0 -200 L26 -160 V-40 Z" fill="#d7dbe0" stroke="#0d0e0f" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M-14 90 H14 M-14 60 H14" fill="none" stroke="#0d0e0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="rotate(34) translate(80 20)">
    <rect x="-22" y="-150" width="44" height="230" rx="10" fill="#b4b9be" stroke="#0d0e0f" stroke-width="8" stroke-linejoin="round"/>
    <rect x="-22" y="40" width="44" height="150" rx="10" fill="#0d0e0f" stroke="#0d0e0f" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-6 -120 V-40" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  </g></g></g>
</svg>
